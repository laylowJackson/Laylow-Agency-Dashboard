<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trading Command Center</title>

  <style>
    :root {
      --bg-1: #050612;
      --bg-2: #0a0d1d;
      --panel: #11162b;
      --panel-alt: #0d1224;
      --panel-border: #29325c;
      --text: #ffffff;
      --muted: #9da6c9;
      --muted-2: #8994b5;
      --primary: #7357ff;
      --primary-2: #6f55c7;
      --success: #31f09d;
      --danger: #ff5c79;
      --warning: #ffd966;
      --danger-bg: #401526;
      --danger-border: #742944;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: linear-gradient(180deg, var(--bg-1), var(--bg-2));
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    .container {
      padding: 18px;
      max-width: 1200px;
      margin: auto;
    }

    h1 { margin-bottom: 5px; }

    .subtitle {
      color: var(--muted);
      margin-bottom: 20px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      padding: 15px;
    }

    .label {
      color: #8e99bb;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .value {
      font-size: 24px;
      font-weight: bold;
      margin-top: 4px;
    }

    .workers {
      display: grid;
      gap: 10px;
      margin-bottom: 18px;
    }

    .worker {
      background: var(--panel-alt);
      border: 1px solid #252d52;
      border-radius: 12px;
      padding: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
    }

    .worker-name { font-weight: bold; }

    .worker-sub {
      font-size: 12px;
      color: var(--muted-2);
      margin-top: 4px;
    }

    .positive { color: var(--success); }
    .negative { color: var(--danger); }

    button, select, input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border-radius: 10px;
      border: none;
      margin-top: 8px;
      font-size: 16px;
    }

    select, input {
      background: #0c1124;
      color: var(--text);
      border: 1px solid #29345e;
    }

    button {
      background: var(--primary);
      color: var(--text);
      font-weight: bold;
      cursor: pointer;
    }

    .secondary {
      background: #1c2444;
      border: 1px solid #3c4c8f;
    }

    .danger {
      background: var(--danger-bg);
      border: 1px solid var(--danger-border);
    }

    .log {
      background: #080c19;
      border-radius: 10px;
      padding: 10px;
      max-height: 220px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 12px;
      line-height: 1.5;
    }

    .vault {
      text-align: center;
      background: linear-gradient(135deg, #17112d, #201846);
      border: 1px solid var(--primary-2);
      border-radius: 16px;
      padding: 18px;
      margin: 18px 0;
    }

    .vault-value {
      color: var(--warning);
      font-size: 30px;
      font-weight: bold;
    }

    @media (min-width: 700px) {
      .stats { grid-template-columns: repeat(4, 1fr); }
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Trading Command Center</h1>
  <div class="subtitle">Private paper-trading dashboard</div>

  <div class="stats">
    <div class="card">
      <div class="label">Account Equity</div>
      <div class="value" id="equity">$10,000.00</div>
    </div>

    <div class="card">
      <div class="label">Today P&L</div>
      <div class="value" id="pnl">$0.00</div>
    </div>

    <div class="card">
      <div class="label">Win Rate</div>
      <div class="value" id="winRate">0%</div>
    </div>

    <div class="card">
      <div class="label">Trades</div>
      <div class="value" id="trades">0</div>
    </div>
  </div>

  <div class="vault">
    <div class="label">THE VAULT</div>
    <div class="vault-value" id="vault">$0.00</div>
  </div>

  <h2>Workers</h2>
  <div class="workers" id="workers"></div>

  <div class="card">
    <h2>Paper Trade</h2>

    <label>Symbol</label>
    <select id="symbol">
      <option>SPY</option>
      <option>QQQ</option>
    </select>

    <label>Direction</label>
    <select id="direction">
      <option>CALL</option>
      <option>PUT</option>
    </select>

    <label>Risk Amount</label>
    <input id="risk" type="number" value="50" min="1" />

    <label>Daily Loss Limit</label>
    <input id="lossLimit" type="number" value="250" min="1" />

    <button onclick="paperTrade()">Run Paper Trade</button>
    <button class="secondary" onclick="resetAccount()">Reset Account</button>
    <button class="danger" onclick="toggleKill()">Kill Switch</button>
  </div>

  <h2>Activity</h2>
  <div class="log" id="log">Waiting for trade...</div>
</div>

<script>
const STORAGE_KEY = "laylow-agency-trading-state-v1";

const defaultState = {
  startingBalance: 10000,
  balance: 10000,
  pnl: 0,
  trades: 0,
  wins: 0,
  killed: false
};

const defaultWorkers = [
  { name: "QQQ Momentum", sub: "Trend / breakout strategy", pnl: 0 },
  { name: "SPY VWAP", sub: "Mean-reversion strategy", pnl: 0 },
  { name: "QQQ Trend", sub: "Trend-following strategy", pnl: 0 },
  { name: "Signal Scanner", sub: "Scans market setups", pnl: 0 }
];

let state = loadState();
let workers = loadWorkers();

function money(value) {
  const sign = value < 0 ? "-$" : "$";
  return sign + Math.abs(value).toFixed(2);
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ state, workers }));
  } catch (e) {
    console.warn("Failed to save state", e);
  }
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return { ...defaultState };
    const parsed = JSON.parse(raw);
    return { ...defaultState, ...parsed.state };
  } catch (e) {
    console.warn("Failed to load state", e);
    return { ...defaultState };
  }
}

function loadWorkers() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return defaultWorkers.map(w => ({ ...w }));
    const parsed = JSON.parse(raw);
    const saved = Array.isArray(parsed.workers) ? parsed.workers : defaultWorkers;
    return defaultWorkers.map((template, index) => ({
      ...template,
      ...(saved[index] || {})
    }));
  } catch (e) {
    console.warn("Failed to load workers", e);
    return defaultWorkers.map(w => ({ ...w }));
  }
}

function renderWorkers() {
  const container = document.getElementById("workers");
  container.innerHTML = "";

  workers.forEach(worker => {
    const div = document.createElement("div");
    div.className = "worker";

    div.innerHTML = `
      <div>
        <div class="worker-name">${worker.name}</div>
        <div class="worker-sub">${worker.sub}</div>
      </div>
      <div class="${worker.pnl >= 0 ? "positive" : "negative"}">${money(worker.pnl)}</div>
    `;

    container.appendChild(div);
  });
}

function updateDashboard() {
  document.getElementById("equity").innerText = money(state.balance);
  document.getElementById("pnl").innerText = money(state.pnl);
  document.getElementById("vault").innerText = money(state.pnl);
  document.getElementById("trades").innerText = state.trades;

  const winRate = state.trades ? Math.round((state.wins / state.trades) * 100) : 0;
  document.getElementById("winRate").innerText = winRate + "%";

  const pnlClass = state.pnl >= 0 ? "value positive" : "value negative";
  document.getElementById("pnl").className = pnlClass;
  document.getElementById("vault").className = "vault-value " + (state.pnl >= 0 ? "positive" : "negative");

  renderWorkers();
}

function addLog(text) {
  const log = document.getElementById("log");
  const time = new Date().toLocaleTimeString();
  log.innerHTML = time + " - " + text + "<br>" + log.innerHTML;
}

function resetAccount() {
  state = { ...defaultState };
  workers = defaultWorkers.map(w => ({ ...w }));
  saveState();
  addLog("Account reset. Starting balance restored.");
  updateDashboard();
}

function paperTrade() {
  if (state.killed) {
    addLog("Trade blocked. Kill switch is ON.");
    return;
  }

  const symbol = document.getElementById("symbol").value;
  const direction = document.getElementById("direction").value;
  const risk = Number(document.getElementById("risk").value);
  const lossLimit = Number(document.getElementById("lossLimit").value);

  if (!Number.isFinite(risk) || risk <= 0) {
    addLog("Risk amount must be a positive number.");
    return;
  }

  if (!Number.isFinite(lossLimit) || lossLimit <= 0) {
    addLog("Daily loss limit must be a positive number.");
    return;
  }

  if (state.pnl <= -lossLimit) {
    state.killed = true;
    saveState();
    addLog("Daily loss limit reached.");
    updateDashboard();
    return;
  }

  const workerIndex = Math.floor(Math.random() * workers.length);
  const win = Math.random() < 0.47;

  let result;
  if (win) {
    result = risk * (0.5 + Math.random() * 1.5);
  } else {
    result = -risk * (0.5 + Math.random() * 0.5);
  }

  result = Math.round(result * 100) / 100;

  state.balance += result;
  state.pnl += result;
  state.trades++;
  workers[workerIndex].pnl += result;

  if (win) state.wins++;

  addLog(workers[workerIndex].name + " | " + symbol + " " + direction + " | " + money(result));

  saveState();
  updateDashboard();
}

function toggleKill() {
  state.killed = !state.killed;
  saveState();
  addLog(state.killed ? "Kill switch ON." : "Trading resumed.");
  updateDashboard();
}

updateDashboard();
</script>
</body>
</html>
